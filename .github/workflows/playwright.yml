name: Playwright Tests

# Runs on demand. The suite needs a running ParaBank instance; this job starts
# one from Parasoft's Docker image. Register the test user from
# test-data/*.json on that instance (or set PARABANK_USER / PARABANK_PASS
# repository secrets) before relying on the results.
on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      parabank:
        image: parasoft/parabank
        ports:
          - 8080:8080
    env:
      PARABANK_URL: http://localhost:8080/parabank/
      PARABANK_USER: ${{ secrets.PARABANK_USER }}
      PARABANK_PASS: ${{ secrets.PARABANK_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for ParaBank
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/parabank/index.htm > /dev/null && exit 0
            sleep 5
          done
          echo "ParaBank did not start" && exit 1
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
